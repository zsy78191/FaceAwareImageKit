name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  examples:
    name: Examples (xcodegen)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cd Examples
          xcodegen generate
      - name: Build & test demo
        run: |
          cd Examples
          xcodebuild \
            -project FaceAwareImageKitExamples.xcodeproj \
            -scheme FaceAwareImageLab \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            test
