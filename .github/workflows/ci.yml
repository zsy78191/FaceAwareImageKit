name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package (SwiftPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  examples:
    name: Examples (xcodegen)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: |
          cd Examples
          xcodegen generate
      - name: Build & test demo
        run: |
          cd Examples
          simulator_id="$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/ && $2 ~ /^[0-9A-F-]+$/ { print $2; exit }')"
          if [[ -z "$simulator_id" ]]; then
            echo "::error::No available iPhone Simulator was found on the runner"
            exit 1
          fi
          echo "Using iPhone Simulator: $simulator_id"
          xcodebuild \
            -project FaceAwareImageKitExamples.xcodeproj \
            -scheme FaceAwareImageLab \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -configuration Debug \
            test
